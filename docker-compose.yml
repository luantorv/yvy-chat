services:
  ollama:
    image: ollama/ollama:latest
    container_name: yvy-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: yvy-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./backend:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling nomic-embed-text..."
        ollama pull nomic-embed-text
        echo "Pulling gemma2..."
        ollama pull gemma2
        echo "Creating argano-contract-assistant model..."
        ollama create argano-contract-assistant -f /workspace/modelfile
        echo "Models ready."
    restart: "no"

  backend:
    image: node:20-alpine
    container_name: yvy-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PORT=3001
      - NODE_ENV=development
    depends_on:
      ollama:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: yvy-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

volumes:
  ollama_data:
  backend_node_modules:
  frontend_node_modules:
